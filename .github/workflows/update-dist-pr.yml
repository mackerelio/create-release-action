name: 'Update dist/'
on:
  push:
    branches:
      - main

jobs:
  update-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm ci
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-dist
          commit-message: Update dist/
          title: Update dist/
          body: |
            This pull request is generated by https://github.com/${{ github.repository}}/blob/main/.github/workflows/update-dist-pr.yml
